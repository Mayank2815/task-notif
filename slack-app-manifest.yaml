display_information:
  name: Task Reminder
  description: Daily Teamwork task reminders
  background_color: "#0e1116"
features:
  bot_user:
    display_name: Task Reminder
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_hosted: false
